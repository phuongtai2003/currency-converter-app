name: Build Android APK

on:
  push:
    branches: [ gh-actions ]

  pull_request:
    branches: [ gh-actions ]

jobs:
  testing:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: setup JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          cache-disabled: false

      - name: Ensure SDK Manager Licenses
        run: yes | sdkmanager --licenses


      - name: Create local.properties
        run: |
          echo "sdk.dir=$HOME/Android/Sdk" >> ${{ github.workspace }}/local.properties
          echo "EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}" >> ${{ github.workspace }}/local.properties

      - name: Unit Tests
        run: bash ./gradlew test --stacktrace

  build-apk:
    name: Building an APK file
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: setup JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Setup Android SDK
        uses: amyu/setup-android@v4
        with:
          cache-disabled: false

      - name: Ensure SDK Manager Licenses
        run: yes | sdkmanager --licenses


      - name: Create local.properties
        run: |
          echo "sdk.dir=$HOME/Android/Sdk" >> ${{ github.workspace }}/local.properties
          echo "EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}" >> ${{ github.workspace }}/local.properties

      - name: Build APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Push to Releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: v1.0.${{ github.run_number }}
          body: "Release v1.0.${{ github.run_number }}"
          token: ${{ secrets.PROJECT_TOKEN }}

