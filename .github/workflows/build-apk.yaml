name: Build Android APK

on:
  push:
    branches: [ gh-actions ]

  pull_request:
    branches: [ gh-actions ]

jobs:
  testing:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: setup JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Create local.properties
        run: |
          echo "sdk.dir=$HOME/Android/Sdk" >> ./key.properties
          echo "EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}" >> ./key.properties

      - name: Unit Tests
        run: bash ./gradlew test --stacktrace

